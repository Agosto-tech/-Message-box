<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <style>
    body {font-family: Arial; background:#f5f5f5;}
    .box {
      max-width:500px; margin:40px auto; padding:20px;
      background:white; border-radius:12px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }
    textarea, input {
      width:100%; padding:10px; margin-bottom:10px;
      border-radius:8px; border:1px solid #ccc;
    }
    button {
      width:100%; padding:10px; border:none;
      border-radius:8px; background:black; color:white;
      font-size:16px;
    }
  </style>
</head>
<body>
<div class="box">
  <h2>Share Your Story</h2>
  <input type="text" id="name" placeholder="Your name (optional)">
  <textarea id="message" placeholder="Write here..."></textarea>
  <button onclick="sendMail()">Send</button>
</div>

<script>
(function(){ emailjs.init("XtrLAL_RDakAQOZTO"); })();

function sendMail() {
  var params = {
    from_name: document.getElementById("name").value,
    message: document.getElementById("message").value,
  };

  emailjs.send("service_f3904gs", "template_2iifmrs", params)
  .then(function() {
    alert("Message sent!");
  });
}
</script>
</body>
</html>
